version: 2
updates:
  # Go modules: one grouped pull request a month, so bumps that touch
  # go.mod/go.sum together never conflict with each other.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      go-modules:
        patterns: ["*"]
  # Workflow actions are pinned to commit SHAs; Dependabot updates the pins
  # and their version comments in one grouped pull request a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
