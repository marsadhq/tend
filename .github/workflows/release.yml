# Launch-day release pipeline for tend.
#
# This workflow is SEPARATE from ci.yml and DORMANT until a version tag is
# pushed: ci.yml runs on every push/PR (gofmt/vet/build/test matrix), whereas
# this workflow runs ONLY on `vX.Y.Z` tags and drives GoReleaser to build the
# linux/amd64 + linux/arm64 binaries, publish the GitHub Release with archives
# and checksums, and push multi-arch images to ghcr.io/marsadhq/tend.
#
# Trigger a release by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Write release assets to the GitHub Release and push images to GHCR.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so GoReleaser's git-based changelog can see all commits.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # QEMU provides the arm64 emulation buildx needs to assemble the arm64
      # image manifest on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
