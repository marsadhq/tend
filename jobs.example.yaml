# tend example configuration.
#
# Copy this file, edit it for your environment, then apply it:
#
#   cp jobs.example.yaml jobs.yaml
#   tend sync jobs.yaml
#
# `tend sync` is declarative and idempotent: this file is the source of truth,
# so re-running it converges the store to match. By default any job in the
# store but absent from the file is DISABLED (its run history is kept); pass
# `tend sync -prune=false jobs.yaml` to leave absent jobs untouched instead.
#
# A few rules to keep in mind:
#   * Each job sets at most one schedule: `cron`, `interval_seconds`, or a
#     one-off `run_at`. Omit all three for a manual job you trigger yourself
#     with `tend run <name>` (or POST /api/jobs/{id}/run).
#   * Secrets are referenced as {{ secret.NAME }} and never written in plaintext
#     here. Create them first:  printf 'value' | tend secret set NAME
#     Channel-config secrets resolve at sync time; job `env` secrets at run time.
#   * Notification channels require TEND_MASTER_KEY to be set (it encrypts the
#     stored channel config). Delete any channels, rules, or jobs you do not use.

jobs:
  # Shell job on a cron schedule, with a timeout, retries, and a secret in env.
  - name: nightly-db-backup
    type: shell
    command: "pg_dump -Fc mydb | restic backup --stdin --stdin-filename db.dump"
    cron: "0 3 * * *"             # 03:00 every day (server time zone)
    timeout_seconds: 1800         # kill the run if it exceeds 30 minutes
    max_retries: 2                # retry up to twice on failure
    env:                          # env is applied to shell jobs only
      RESTIC_REPOSITORY: "s3:s3.amazonaws.com/my-bucket/tend"
      RESTIC_PASSWORD: "{{ secret.restic_password }}"

  # Shell job on a fixed interval.
  - name: prune-old-logs
    type: shell
    command: "find /var/log/myapp -name '*.log' -mtime +14 -delete"
    interval_seconds: 86400       # once every 24 hours

  # HTTP health check. Any non-2xx response (or a timeout) marks the run failed,
  # which can drive a run.failed alert via the rules below.
  - name: api-health
    type: http
    http_url: "https://api.example.com/healthz"
    http_method: GET              # default is GET
    interval_seconds: 300         # every 5 minutes
    timeout_seconds: 10

  # HTTP POST with a body, with no schedule: trigger it on demand with
  #   tend run deploy-hook
  - name: deploy-hook
    type: http
    http_url: "https://ci.example.com/hooks/deploy"
    http_method: POST
    http_body: '{"service":"web","ref":"main"}'

  # One-off job: runs once at the given RFC3339 time, then never again.
  # Use a future timestamp (UTC "Z" or an explicit offset).
  - name: scheduled-migration
    type: shell
    command: "/opt/myapp/bin/migrate --apply"
    run_at: "2030-01-01T02:00:00Z"

  # Defined but turned off. Flip `enabled` (or run `tend job enable weekly-report`)
  # and re-sync to activate it.
  - name: weekly-report
    type: shell
    command: "/opt/myapp/bin/email-weekly-report"
    cron: "0 8 * * 1"             # Mondays at 08:00
    enabled: false

  # --- Probes: things that expire (see docs/probes.md) ---------------------
  # A probe fails its run (run.failed) when what it watches is within
  # warn_days of its expiry, and the next good run records run.recovered.
  # Every failing run alerts, so run probes every few hours or daily.

  # A TLS certificate: days left, host name, chain, and whether it is past the
  # point its ACME client should have renewed it (renew_after_fraction).
  - name: web-cert
    type: tls
    host: example.com
    # port: 443                   # default 443
    # warn_days: 14               # default 14
    # renew_after_fraction: 0.667 # default 2/3; 0 for a certificate renewed by hand
    interval_seconds: 21600       # every 6 hours
    timeout_seconds: 30

  # A mail server's certificate, upgraded with STARTTLS on the submission port.
  - name: mail-cert
    type: tls
    host: mail.example.com
    port: 587
    starttls: smtp                # smtp or imap
    interval_seconds: 21600
    timeout_seconds: 30

  # A domain's registration expiry, over RDAP (IANA's bootstrap file finds the
  # registry). Some TLDs have no RDAP server: use an expiry job for those.
  - name: example-com-registration
    type: domain
    domain: example.com
    warn_days: 30                 # default 30
    cron: "0 6 * * *"
    timeout_seconds: 30

  # A date nothing can be asked about: a licence, a token, a contract.
  - name: vendor-licence
    type: expiry
    expires_at: "2027-01-31"      # RFC 3339 or a bare date (midnight UTC)
    cron: "0 9 * * *"

  # A date a command prints (one RFC 3339 date on stdout). It runs like a
  # shell job's command, with the job's env; its output is only parsed.
  - name: tailscale-node-key
    type: expiry
    expiry_command: "tailscale status --json | jq -er .Self.KeyExpiry"
    warn_days: 7
    cron: "0 9 * * *"
    timeout_seconds: 30

  # --- Restore drills (see docs/drills.md) ---------------------------------
  # Restore the latest backup into a scratch directory ($TEND_SCRATCH), check
  # it, time the restore, and always clean up. Fails on a failed restore or
  # check, or a restore slower than max_duration_seconds.
  - name: app-db-restore-drill
    type: drill
    scratch_dir: /var/tmp         # default: the system's temp dir
    restore: 'cp "$(ls -1t /backups/app-*.db | head -n 1)" "$TEND_SCRATCH/app.db"'
    checks:
      - test "$(sqlite3 "$TEND_SCRATCH/app.db" 'PRAGMA integrity_check')" = ok
      - test "$(sqlite3 "$TEND_SCRATCH/app.db" 'SELECT count(*) FROM users')" -ge 100
    max_duration_seconds: 300     # the restore-time target
    timeout_seconds: 1800         # the hard limit
    cron: "30 4 * * 0"            # Sundays

# Notification channels and the rules that route events to them. Channels need
# TEND_MASTER_KEY set. Rules may name the alertable events only (sync refuses
# anything else): run.failed, run.recovered, heartbeat.missed,
# heartbeat.recovered, job.removed, heartbeat.removed, notification.failed.
# Set `job:` to scope a rule to a single job; omit it to match all jobs. Keep
# only the channels you actually use.
notifications:
  channels:
    - name: ops-slack
      type: slack
      config:
        webhook_url: "{{ secret.slack_webhook_url }}"

    - name: ops-discord
      type: discord
      config:
        webhook_url: "{{ secret.discord_webhook_url }}"

    - name: raw-webhook
      type: webhook
      config:
        url: "{{ secret.ops_webhook_url }}"

    - name: oncall-email
      type: smtp
      config:
        host: "smtp.example.com"
        port: 587
        username: "alerts@example.com"
        password: "{{ secret.smtp_password }}"
        from: "tend <alerts@example.com>"
        to:
          - "oncall@example.com"
          - "ops@example.com"

    - name: ops-telegram
      type: telegram
      config:
        # Create a bot with @BotFather for bot_token; chat_id is the target chat
        # (a negative number for a group/channel). Both are required.
        bot_token: "{{ secret.telegram_bot_token }}"
        chat_id: "-1001234567890"

    - name: ops-phone
      type: ntfy
      config:
        # The topic's URL on ntfy.sh or a self-hosted server (required). On
        # ntfy.sh anyone who knows a topic's name can read it, so pick a long
        # one and keep it secret. token (tk_...) is optional; priority is 1 to
        # 5 (0 or unset: the server's default, 3); tags are optional.
        url: "{{ secret.ntfy_topic_url }}"
        token: "{{ secret.ntfy_token }}"
        priority: 4
        tags: [warning]

    - name: oncall-pushover
      type: pushover
      config:
        # Your application's API token and the user or group key (both
        # required). priority is -2 to 2; 2 (emergency) repeats every `retry`
        # seconds (at least 30, default 60) until acknowledged, for at most
        # `expire` seconds (at most 10800, default 3600). device and sound are
        # optional.
        token: "{{ secret.pushover_app_token }}"
        user: "{{ secret.pushover_user_key }}"
        priority: 1

  rules:
    # Send every failure, its all-clear, and every heartbeat transition to
    # Slack.
    - channel: ops-slack
      events: [run.failed, run.recovered, heartbeat.missed, heartbeat.recovered]

    # Hear about deliveries that were given up through a second channel: a
    # report of a failed delivery is never itself reported again.
    - channel: oncall-email
      events: [notification.failed]

    # Escalate failures of the critical backup job to email as well.
    - channel: oncall-email
      events: [run.failed]
      job: nightly-db-backup

# Dead-man's-switch heartbeats for work tend does NOT run itself (an external
# cron, a backup on another host, etc.). Tend emits heartbeat.missed if no ping
# arrives within period + grace. `tend heartbeat add` prints the ping URL
# (<TEND_BASE_URL>/ping/<token>); have the external job GET or POST it on success.
heartbeats:
  - name: offsite-backup
    period_seconds: 86400         # expect a ping every 24 hours
    grace_seconds: 3600           # alert if none arrives within 24h + 1h

  - name: external-cron
    period_seconds: 3600          # hourly
    grace_seconds: 300            # 5 minutes of slack before alerting
